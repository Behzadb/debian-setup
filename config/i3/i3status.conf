# i3status configuration file
# Reference: https://i3wm.org/docs/i3status.html

general {
    colors = true
    interval = 5
    output_format = "i3bar"
}

# Disk usage
order += "disk /home"

# Battery status
order += "battery all"

# Temperature
order += "cpu_temperature 0"

# Memory usage
order += "memory"

# CPU usage
order += "cpu_usage"

# Network interfaces
order += "ethernet eth0"
order += "wireless wlan0"

# Volume
order += "volume master"

# Clock
order += "tztime local"

# Disk usage (home partition)
disk "/home" {
    format = "📁 %avail"
    low_threshold = 10
    threshold_type = "percentage_avail"
}

# Battery
battery all {
    format = "%status %percentage %remaining"
    format_down = "🔌"
    status_chr = "⚡"
    status_bat = "🔋"
    status_unk = "?"
    low_threshold = 15
    threshold_type = "percentage"
}

# CPU temperature
cpu_temperature 0 {
    format = "🌡️  %degrees°C"
    path = "/sys/class/thermal/thermal_zone0/temp"
    max_threshold = 95
}

# Memory usage
memory {
    format = "💾 %used/%total"
    threshold_degraded = "10%"
    format_degraded = "⚠️  MEMORY LOW: %used/%total"
}

# CPU usage
cpu_usage {
    format = "📊 %usage"
    degraded_threshold = 50
    format_above_degraded_threshold = "⚠️  CPU: %usage"
}

# Ethernet
ethernet eth0 {
    format_up = "🌐 %ip (%speed)"
    format_down = "🌐 down"
}

# Wireless
wireless wlan0 {
    format_up = "📶 %essid %quality %ip"
    format_down = "📶 down"
}

# Volume
volume master {
    format = "🔊 %volume"
    format_muted = "🔇 muted"
    device = "default"
    mixer = "Master"
}

# Clock
tztime local {
    format = "🕐 %Y-%m-%d %H:%M:%S"
}
