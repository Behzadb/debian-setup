# i3status configuration file
# Auto-generated based on system hardware detection
# Last generated: 2026-02-23 01:33:52
# See https://i3wm.org/docs/i3status.html for complete documentation

general {
    colors = true
    interval = 5
    output_format = "i3bar"
    # Markup can be: "none", "pango", "json"
    markup = "pango"
}

# Define the order of displayed items
order += "disk /home"
order += "disk /"
order += "disk /boot"
order += "battery all"
order += "cpu_temperature 0"
order += "cpu_temperature 1"
order += "cpu_temperature Thermal"
order += "cpu_temperature 2"
order += "cpu_temperature 3"
order += "cpu_temperature 4"
order += "cpu_temperature 5"
order += "cpu_temperature 6"
order += "cpu_temperature 7"
order += "cpu_temperature 8"
order += "cpu_temperature 9"
order += "memory"
order += "cpu_usage"
order += "wireless wlp0s20f3"
order += "ethernet enp0s31f6"
order += "ethernet wwan0"
order += "ethernet vnet0"
order += "ethernet vnet11"
order += "volume master"
order += "backlight intel_backlight"
order += "tztime local"

# ═══════════════════════════════════════════════════════════════════════════
#                         SECTION CONFIGURATIONS
# ═══════════════════════════════════════════════════════════════════════════


# Disk usage monitoring
disk "/home" {
    format = "<span color='#74c7ec'>📁 %avail</span>"
    low_threshold = 10
    threshold_type = "percentage_avail"
    format_below_threshold = "<span color='#f38ba8'>⚠️  %avail</span>"
}


disk "/" {
    format = "<span color='#74c7ec'>📁 / %avail</span>"
    low_threshold = 5
    threshold_type = "percentage_avail"
}

disk "/boot" {
    format = "<span color='#74c7ec'>📁 /boot %avail</span>"
    low_threshold = 5
    threshold_type = "percentage_avail"
}

# Battery status
battery all {
    format = "%status %percentage %remaining"
    format_down = "<span color='#a6e3a1'>🔌 AC</span>"
    status_chr = "<span color='#a6e3a1'>⚡ %percentage</span>"
    status_bat = "<span color='#f9e2af'>🔋 %percentage</span>"
    status_unk = "<span color='#cba6f7'>? %percentage</span>"
    low_threshold = 15
    threshold_type = "percentage"
    last_full_capacity = true
}


# CPU temperature - acpitz
cpu_temperature 0 {
    format = "<span color='#89b4fa'>🌡️  %degrees°C</span>"
    format_above_threshold = "<span color='#f38ba8'>🔥 %degrees°C</span>"
    path = "/sys/class/thermal/thermal_zone0/temp"
    max_threshold = 85
}


