# Atuin Shell History Configuration
# Replaces CTRL-R with a TUI showing: command, directory, exit code, duration
# Docs: https://atuin.sh/docs/config/

# Sync settings - local-only by default (no account needed)
auto_sync = false
sync_frequency = "0"

# Don't phone home for a version check on every shell startup — keeps the shell
# fast and fully offline (matches the local-only, no-account setup above).
update_check = false

# History settings
search_mode = "fuzzy"
filter_mode = "global"      # search all history, not just current session
filter_mode_shell_up_arrow = "session"  # up-arrow = session history only

# UI settings
# Enter drops the selected command onto the prompt to edit/confirm instead of
# running it immediately (Tab also places it; pressing Enter again then runs it).
enter_accept = false
show_preview = true         # show command preview at bottom of TUI
max_preview_height = 4
show_help = false           # hide keybinding help bar
inline_height = 20          # number of rows in inline mode

# History recording
record_exit_code = true

# Secrets — commands matching these patterns are NEVER written to history.
# secrets_filter (on by default) also auto-detects known token formats (AWS keys,
# GitHub tokens, etc.); set explicitly here to make the protection obvious.
secrets_filter = true
history_filter = [
    "^secret ",
    "^export.*KEY=",
    "^export.*TOKEN=",
    "^export.*PASSWORD=",
    "^export.*SECRET=",
]

# Network - disabled since auto_sync = false
sync = { records = false }
