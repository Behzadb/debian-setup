; Polybar Configuration - Catppuccin Mocha Theme
; Replaces i3status with click-actionable, icon-capable status bar
; Docs: https://github.com/polybar/polybar/wiki

; ─────────────────────────────────────────────
; Catppuccin Mocha Color Palette
; ─────────────────────────────────────────────
[colors]
base     = #1e1e2e
mantle   = #181825
crust    = #11111b
surface0 = #313244
surface1 = #45475a
surface2 = #585b70
overlay0 = #6c7086
overlay1 = #7f849c
overlay2 = #9399b2
subtext0 = #a6adc8
subtext1 = #bac2de
text     = #cdd6f4
rosewater = #f5e0dc
flamingo = #f2cdcd
pink     = #f5c2e7
mauve    = #cba6f7
red      = #f38ba8
maroon   = #eba0ac
peach    = #fab387
yellow   = #f9e2af
green    = #a6e3a1
teal     = #94e2d5
sky      = #89dceb
sapphire = #74c7ec
blue     = #89b4fa
lavender = #b4befe

; ─────────────────────────────────────────────
; Main Bar
; ─────────────────────────────────────────────
[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 28
radius = 0
fixed-center = true

background = ${colors.crust}
foreground = ${colors.text}

line-size = 2
line-color = ${colors.blue}

border-size = 0
padding-left = 1
padding-right = 1
module-margin-left = 1
module-margin-right = 1

; FiraCode Nerd Font - required for icons
font-0 = FiraCode Nerd Font:size=10;2
font-1 = FiraCode Nerd Font:size=14;3
font-2 = Noto Color Emoji:scale=10;2

modules-left = i3 xwindow
modules-center = date
modules-right = cpu temperature memory powerprofile battery network pulseaudio

; Only one polybar may own the system tray. launch.sh sets TRAY_POSITION=right
; for the primary monitor and leaves it empty (no tray) on the others.
tray-position = ${env:TRAY_POSITION:}
tray-padding = 4
tray-background = ${colors.crust}

cursor-click = pointer
cursor-scroll = ns-resize

; ─────────────────────────────────────────────
; i3 Workspaces
; ─────────────────────────────────────────────
[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false

label-mode-padding = 2
label-mode-foreground = ${colors.text}
label-mode-background = ${colors.mauve}

; Active workspace
label-focused = %name%
label-focused-background = ${colors.surface0}
label-focused-foreground = ${colors.blue}
label-focused-underline  = ${colors.blue}
label-focused-padding = 2

; Inactive workspace
label-unfocused = %name%
label-unfocused-padding = 2
label-unfocused-foreground = ${colors.overlay1}

; Visible (on other monitor)
label-visible = %name%
label-visible-background = ${colors.surface0}
label-visible-underline = ${colors.teal}
label-visible-padding = 2

; Urgent
label-urgent = %name%
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.crust}
label-urgent-padding = 2

; ─────────────────────────────────────────────
; Active Window Title
; ─────────────────────────────────────────────
[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
label-foreground = ${colors.subtext1}

; ─────────────────────────────────────────────
; Date & Time
; ─────────────────────────────────────────────
[module/date]
type = internal/date
interval = 5

date = %Y-%m-%d
time = %H:%M

format-prefix = " "
format-prefix-foreground = ${colors.blue}
format-foreground = ${colors.text}

label = %date%  %time%

; ─────────────────────────────────────────────
; CPU
; ─────────────────────────────────────────────
[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.peach}
label = %percentage:2%%
label-foreground = ${colors.text}

; ─────────────────────────────────────────────
; Temperature
; ─────────────────────────────────────────────
[module/temperature]
type = internal/temperature
; thermal-zone: index into /sys/class/thermal/thermal_zoneX
; If zone 0 doesn't exist (VM, container, some desktops), module shows format-error
thermal-zone = 0
warn-temperature = 80
; Interval in seconds
interval = 5

format = <ramp> <label>
format-warn = <ramp> <label-warn>
; Shown when no thermal sensor is found (VM, container, missing zone)
format-error = <label-error>

label = %temperature-c%
label-warn = %temperature-c%
label-warn-foreground = ${colors.red}
; Dim placeholder when hardware sensor is absent
label-error = ──°C
label-error-foreground = ${colors.overlay0}

ramp-0 =
ramp-1 =
ramp-2 =
ramp-0-foreground = ${colors.green}
ramp-1-foreground = ${colors.yellow}
ramp-2-foreground = ${colors.red}

; ─────────────────────────────────────────────
; Memory
; ─────────────────────────────────────────────
[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.mauve}
label = %percentage_used:2%%
label-foreground = ${colors.text}

; ─────────────────────────────────────────────
; Battery
; ─────────────────────────────────────────────
[module/battery]
type = internal/battery
; BAT0 is standard; some systems use BAT1 or CMB0 - check: ls /sys/class/power_supply/
battery = BAT0
adapter = AC
full-at = 99
low-at = 20
; Poll interval in seconds
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full-prefix = " "
format-full-prefix-foreground = ${colors.green}
; Shown on desktop systems with no battery (BAT0 absent)
format-full = <label-full>
format-error = <label-error>

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = Full
; Desktop/no-battery fallback: dim plug icon
label-error =
label-error-foreground = ${colors.overlay0}

ramp-capacity-0 =
ramp-capacity-1 =
ramp-capacity-2 =
ramp-capacity-3 =
ramp-capacity-4 =
ramp-capacity-0-foreground = ${colors.red}
ramp-capacity-1-foreground = ${colors.peach}
ramp-capacity-2-foreground = ${colors.yellow}
ramp-capacity-3-foreground = ${colors.green}
ramp-capacity-4-foreground = ${colors.green}

animation-charging-0 =
animation-charging-1 =
animation-charging-2 =
animation-charging-3 =
animation-charging-4 =
animation-charging-foreground = ${colors.yellow}
animation-charging-framerate = 750

; ─────────────────────────────────────────────
; Network
; ─────────────────────────────────────────────
[module/network]
type = internal/network
; "any" auto-detects the active interface (WiFi or Ethernet)
; Works on both laptops (WiFi) and desktops (Ethernet)
interface-type = any
interval = 3

format-connected = <ramp-signal> <label-connected>
format-disconnected = <label-disconnected>

; %ifname% = interface name (e.g. wlan0, eth0), %local_ip% = IP address
label-connected = %ifname%  %local_ip%
label-connected-foreground = ${colors.text}
label-disconnected = 󰤭  no network
label-disconnected-foreground = ${colors.overlay0}

; WiFi signal strength ramp (icon 5 = wired/ethernet fallback)
ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨
ramp-signal-5 = 󰈀
ramp-signal-foreground = ${colors.teal}

; ─────────────────────────────────────────────
; Audio (PulseAudio)
; ─────────────────────────────────────────────
[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.text}

label-muted = 󰝟 muted
label-muted-foreground = ${colors.overlay0}

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.sky}

click-right = pavucontrol &

; ─────────────────────────────────────────────
; Power profile (ThinkPad T14) — shows the ACPI platform profile
; Reading is unprivileged; click cycles it via `sudo power-profile cycle`
; (passwordless sudo set up by scripts/04-power-management.sh).
; Outputs nothing on machines without an ACPI platform profile, so the
; module simply hides itself there.
; ─────────────────────────────────────────────
[module/powerprofile]
type = custom/script
exec = cat /sys/firmware/acpi/platform_profile 2>/dev/null
interval = 10
format-prefix = "⚡ "
format-prefix-foreground = ${colors.yellow}
label = %output%
label-foreground = ${colors.text}
click-left = sudo /usr/local/bin/power-profile cycle
