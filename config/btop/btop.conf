# Btop System Monitor Configuration - Catppuccin Mocha Theme
# Replaces htop with all-in-one CPU/memory/disk/network/process view
# Docs: https://github.com/aristocratos/btop#configurability

# Color theme
color_theme = "catppuccin_mocha"

# Enable vim-style keybindings
vim_keys = True

# Shown panels (cpu mem net proc disk)
shown_boxes = "cpu mem net proc"

# CPU panel
cpu_single_graph = False
cpu_bottom = False
cpu_invert_lower = True

# Process panel
proc_tree = True
proc_colors = True
proc_gradient = True
proc_per_core = False
proc_mem_bytes = True
proc_cpu_graphs = True
proc_info_smaps = False
proc_left = False
proc_filter_kernel = False
proc_aggregate = False

# Memory panel
mem_graphs = True
mem_below_net = False
zfs_arc_cached = True

# Network panel
net_download = 100
net_upload = 100
net_auto = True
net_sync = False
net_iface = ""

# Disk panel
disks_filter = ""
only_physical = True
use_fstab = False
show_disks = True
disk_free_priv = False

# Update interval in milliseconds
update_ms = 2000

# Log level (ERROR, WARNING, INFO, DEBUG)
log_level = "WARNING"

# Show battery in menu bar
show_battery = True
selected_battery = "Auto"
