# Kitty Terminal Configuration
# GPU-accelerated terminal with ligature support and Catppuccin Mocha theme

# Font - FiraCode Nerd Font enables ligatures AND icons (for eza/starship/polybar)
font_family      FiraCode Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Ligature settings
disable_ligatures never

# Cursor
cursor_shape     block
cursor_blink_interval 0.5

# Scrollback
scrollback_lines 10000

# Mouse
mouse_hide_wait  3.0
# "clipboard" copies to system clipboard on select (changed from "yes" in Kitty 0.31+)
copy_on_select   clipboard

# Display Server (ensures compatibility with modern Debian compositors)
linux_display_server auto

# Bell
enable_audio_bell no
visual_bell_duration 0.0

# Window
window_padding_width 8
hide_window_decorations no
remember_window_size   yes
initial_window_width   1200
initial_window_height  800

# Tab bar
tab_bar_edge         bottom
tab_bar_style        powerline
tab_powerline_style  slanted
tab_title_template   "{index}: {title}"

# URL handling
url_style            single

# Performance
repaint_delay    10
input_delay      3
sync_to_monitor  yes

# Keyboard shortcuts
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab
map ctrl+equal       change_font_size all +1.0
map ctrl+minus       change_font_size all -1.0
map ctrl+0           change_font_size all 0

# Catppuccin Mocha color scheme
# See: https://github.com/catppuccin/kitty
foreground              #cdd6f4
background              #1e1e2e
selection_foreground    #1e1e2e
selection_background    #f5c2e7

cursor                  #f5e0dc
cursor_text_color       #1e1e2e

url_color               #f5c2e7

# Window border colors
active_border_color     #b4befe
inactive_border_color   #6c7086
bell_border_color       #f9e2af

# Tab bar
active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
tab_bar_background      #11111b

