# Starship Prompt Configuration - Catppuccin Mocha
# Cross-shell, async, shows git/lang info without slowing down prompts
# Docs: https://starship.rs/config/

# Prompt format: two-line with context info on line 1, input on line 2
format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$fill\
$nodejs\
$python\
$golang\
$docker_context\
$kubernetes\
$battery\
$time\
$line_break\
$character"""

# Catppuccin Mocha palette
palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
red       = "#f38ba8"
maroon    = "#eba0ac"
peach     = "#fab387"
yellow    = "#f9e2af"
green     = "#a6e3a1"
teal      = "#94e2d5"
sky       = "#89dceb"
sapphire  = "#74c7ec"
blue      = "#89b4fa"
lavender  = "#b4befe"
text      = "#cdd6f4"
subtext1  = "#bac2de"
subtext0  = "#a6adc8"
overlay2  = "#9399b2"
overlay1  = "#7f849c"
overlay0  = "#6c7086"
surface2  = "#585b70"
surface1  = "#45475a"
surface0  = "#313244"
base      = "#1e1e2e"
mantle    = "#181825"
crust     = "#11111b"

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"

[directory]
style            = "bold blue"
read_only        = " 󰌾"
truncation_length = 4
truncate_to_repo = true

[git_branch]
symbol    = " "
style     = "bold mauve"
format    = "[$symbol$branch(:$remote_branch)]($style) "

[git_status]
format    = "([$all_status$ahead_behind]($style) )"
style     = "bold red"
ahead     = "⇡${count}"
behind    = "⇣${count}"
diverged  = "⇡${ahead_count}⇣${behind_count}"
modified  = "!${count}"
untracked = "?${count}"
staged    = "+${count}"
deleted   = "✘${count}"

[nodejs]
symbol  = " "
style   = "bold green"
format  = "[$symbol($version )]($style)"

[python]
symbol       = " "
style        = "bold yellow"
format       = "[$symbol$pyenv_prefix($version )($virtualenv )]($style)"
pyenv_version_name = true

[golang]
symbol = " "
style  = "bold sky"
format = "[$symbol($version )]($style)"

[docker_context]
symbol = " "
style  = "bold blue"
format = "[$symbol$context]($style) "
only_with_files = true

[kubernetes]
symbol   = "󱃾 "
style    = "bold blue"
format   = "[$symbol$context( \\($namespace\\))]($style) "
disabled = false

[battery]
full_symbol        = "󰁹"
charging_symbol    = "󰂄"
discharging_symbol = "󰂃"
unknown_symbol     = "󰁽"
empty_symbol       = "󰂎"
format             = "[$symbol$percentage]($style) "

[[battery.display]]
threshold = 30
style     = "bold red"

[[battery.display]]
threshold = 70
style     = "bold yellow"

[time]
disabled    = false
format      = "[$time]($style)"
style       = "bold overlay1"
time_format = "%H:%M"

[fill]
symbol = " "

[username]
show_always = false
style_user  = "bold blue"
format      = "[$user]($style) "

[hostname]
ssh_only  = true
style     = "bold mauve"
format    = "[@$hostname]($style) "
