# Dotbot Configuration - Manages symlinks for dotfiles

- defaults:
    link:
      relink: true        # Replace broken symlinks automatically
      force: true         # Overwrite existing symlinks if they point to the right target
      create: true        # Create parent directories if needed

# Phase 0: Create required config directories
- shell:
    - command: |
        set -e
        echo "[Phase 0] Preparing configuration directories..."
        # i3status.conf is no longer used - Polybar handles status bar natively
        # The generate-i3status-conf.sh script is kept for reference but not run
        echo "Note: i3status replaced by Polybar - no hardware detection needed"
      description: Phase 0 setup note
      stderr: true

# Verify repository structure
- shell:
    - command: |
        set -e
        echo "[Phase 1] Verifying repository structure..."
        
        # Get the directory where this config file is located (dotbot runs from repo root)
        REPO_ROOT="$(pwd)"
        
        # Check required directories exist
        if [ ! -d "$REPO_ROOT/config/shell" ]; then
          echo "ERROR: Missing config/shell directory in $REPO_ROOT"
          exit 1
        fi
        
        if [ ! -d "$REPO_ROOT/config/i3" ]; then
          echo "ERROR: Missing config/i3 directory in $REPO_ROOT"
          exit 1
        fi
        
        # Check critical dotfiles exist
        if [ ! -f "$REPO_ROOT/config/shell/.bashrc" ]; then
          echo "ERROR: Missing config/shell/.bashrc"
          exit 1
        fi
        
        echo "✓ Repository structure verified"
        echo "  - config/shell/ exists"
        echo "  - config/i3/ exists"
        echo "  - All required dotfiles present"
      description: Verify repository structure and dotfiles exist
      stderr: true

# Create required directories first
- create:
    - ~/.config
    - ~/.config/i3
    - ~/.config/i3status
    - ~/.config/kitty
    - ~/.config/polybar
    - ~/.config/starship
    - ~/.config/atuin
    - ~/.config/dunst
    - ~/.config/btop
    - ~/.config/lazygit
    - ~/.config/betterlockscreen
    - ~/.config/rofi
    - ~/Pictures/screenshots

# Backup existing configs before symlinking
- shell:
    - command: |
        backup_count=0
        
        if [ -f "$HOME/.bashrc" ] && [ ! -L "$HOME/.bashrc" ]; then
          timestamp=$(date +%Y%m%d_%H%M%S)
          cp "$HOME/.bashrc" "$HOME/.bashrc.backup.$timestamp" || { echo "WARN: Failed to backup .bashrc"; exit 1; }
          echo "  ✓ Backed up ~/.bashrc → ~/.bashrc.backup.$timestamp"
          ((backup_count++))
        fi
        
        if [ -f "$HOME/.zshrc" ] && [ ! -L "$HOME/.zshrc" ]; then
          timestamp=$(date +%Y%m%d_%H%M%S)
          cp "$HOME/.zshrc" "$HOME/.zshrc.backup.$timestamp" || { echo "WARN: Failed to backup .zshrc"; exit 1; }
          echo "  ✓ Backed up ~/.zshrc → ~/.zshrc.backup.$timestamp"
          ((backup_count++))
        fi
        
        if [ -f "$HOME/.gitconfig" ] && [ ! -L "$HOME/.gitconfig" ]; then
          timestamp=$(date +%Y%m%d_%H%M%S)
          cp "$HOME/.gitconfig" "$HOME/.gitconfig.backup.$timestamp" || { echo "WARN: Failed to backup .gitconfig"; exit 1; }
          echo "  ✓ Backed up ~/.gitconfig → ~/.gitconfig.backup.$timestamp"
          ((backup_count++))
        fi
        
        if [ -f "$HOME/.config/i3/config" ] && [ ! -L "$HOME/.config/i3/config" ]; then
          timestamp=$(date +%Y%m%d_%H%M%S)
          cp "$HOME/.config/i3/config" "$HOME/.config/i3/config.backup.$timestamp" || { echo "WARN: Failed to backup i3 config"; exit 1; }
          echo "  ✓ Backed up ~/.config/i3/config → ~/.config/i3/config.backup.$timestamp"
          ((backup_count++))
        fi
        
        if [ $backup_count -eq 0 ]; then
          echo "  (No existing files to backup - clean install)"
        fi
      description: Backup existing configs
      stderr: true

# PHASE 3: Permission check before linking
- shell:
    - command: |
        echo ""
        echo "[Phase 3] Preparing to create symlinks..."
        
        # Check that we can write to home
        if [ ! -w "$HOME" ]; then
          echo "ERROR: Cannot write to $HOME - permission denied"
          exit 1
        fi
        
        echo "✓ Write permissions verified"
      description: Pre-check permissions before linking
      stderr: true

# Create symlinks to repository dotfiles
- link:
    # Shell configs
    ~/.bashrc:
      path: config/shell/.bashrc
    ~/.zshrc:
      path: config/shell/.zshrc
    ~/.gitconfig:
      path: config/shell/.gitconfig
    # X11 startup (exec i3 when running: startx)
    ~/.xinitrc:
      path: config/shell/.xinitrc
    # i3 window manager
    ~/.config/i3/config:
      path: config/i3/config
    ~/.config/i3/setup-monitors.sh:
      path: config/i3/setup-monitors.sh
    # i3status (kept as fallback, Polybar is primary)
    ~/.config/i3status/config:
      path: config/i3/i3status.conf
    # Kitty terminal (GPU-accelerated, Catppuccin Mocha)
    ~/.config/kitty/kitty.conf:
      path: config/kitty/kitty.conf
    # Polybar status bar
    ~/.config/polybar/config.ini:
      path: config/polybar/config.ini
    ~/.config/polybar/launch.sh:
      path: config/polybar/launch.sh
    # Starship prompt
    ~/.config/starship.toml:
      path: config/starship.toml
    # Atuin shell history
    ~/.config/atuin/config.toml:
      path: config/atuin/config.toml
    # Dunst notifications (Catppuccin Mocha)
    ~/.config/dunst/dunstrc:
      path: config/dunst/dunstrc
    # Btop system monitor
    ~/.config/btop/btop.conf:
      path: config/btop/btop.conf
    # Lazygit TUI
    ~/.config/lazygit/config.yml:
      path: config/lazygit/config.yml
    # betterlockscreen (blurred wallpaper lock screen, Catppuccin Mocha)
    ~/.config/betterlockscreen/betterlockscreenrc:
      path: config/betterlockscreen/betterlockscreenrc
    # Rofi launcher (Catppuccin Mocha theme + config with drun mode enabled)
    ~/.config/rofi/catppuccin-mocha.rasi:
      path: config/rofi/catppuccin-mocha.rasi
    ~/.config/rofi/config.rasi:
      path: config/rofi/config.rasi

# Make shell scripts executable
- shell:
    - command: |
        if [ -L "$HOME/.config/i3/setup-monitors.sh" ]; then
          chmod +x "$HOME/.config/i3/setup-monitors.sh"
          echo "  ✓ Made ~/.config/i3/setup-monitors.sh executable"
        fi
        if [ -L "$HOME/.config/polybar/launch.sh" ]; then
          chmod +x "$HOME/.config/polybar/launch.sh"
          echo "  ✓ Made ~/.config/polybar/launch.sh executable"
        fi
        if [ -L "$HOME/.xinitrc" ]; then
          chmod +x "$HOME/.xinitrc"
          echo "  ✓ Made ~/.xinitrc executable"
        fi
      description: Make shell scripts executable
      stderr: true

# Warm betterlockscreen cache (pre-caches blur for instant lock)
- shell:
    - command: |
        if command -v betterlockscreen >/dev/null 2>&1; then
          # Find a wallpaper to cache (check common locations)
          wallpaper=""
          for candidate in \
            "$HOME/.config/i3/wallpaper.png" \
            "$HOME/.config/i3/wallpaper.jpg" \
            "$HOME/Pictures/wallpaper.png" \
            "$HOME/Pictures/wallpaper.jpg" \
            "/usr/share/backgrounds/gnome/adwaita-l.jpg" \
            "/usr/share/backgrounds/debian-10-gnome.png" \
            "/usr/share/pixmaps/debian-logo.png"
          do
            if [ -f "$candidate" ]; then
              wallpaper="$candidate"
              break
            fi
          done
          if [ -n "$wallpaper" ]; then
            echo "  Caching betterlockscreen blur effect with: $wallpaper"
            betterlockscreen -u "$wallpaper" 2>/dev/null && \
              echo "  ✓ betterlockscreen cache ready (lock screen will be instant)" || \
              echo "  ✗ betterlockscreen cache failed (lock screen will still work, may be slow)"
          else
            echo "  (No wallpaper found - run: betterlockscreen -u /path/to/wallpaper.png)"
            echo "  ✓ betterlockscreen is installed and configured"
          fi
        else
          echo "  (betterlockscreen not installed yet - cache will be created after install)"
        fi
      description: Warm betterlockscreen blur cache for instant lock screen
      stderr: true

# Verify symlink creation
- shell:
    - command: |
        echo ""
        echo "[Phase 4] Verifying symlink creation..."
        echo ""
        echo "Dotfile Installation Summary:"
        echo "═════════════════════════════════════════"
        echo ""
        
        # Arrays for tracking
        success_links=()
        failed_links=()
        
        # Check each symlink
        for link_path in \
          "$HOME/.bashrc" \
          "$HOME/.zshrc" \
          "$HOME/.gitconfig" \
          "$HOME/.xinitrc" \
          "$HOME/.config/i3/config" \
          "$HOME/.config/i3/setup-monitors.sh" \
          "$HOME/.config/i3status/config" \
          "$HOME/.config/kitty/kitty.conf" \
          "$HOME/.config/polybar/config.ini" \
          "$HOME/.config/polybar/launch.sh" \
          "$HOME/.config/starship.toml" \
          "$HOME/.config/atuin/config.toml" \
          "$HOME/.config/dunst/dunstrc" \
          "$HOME/.config/btop/btop.conf" \
          "$HOME/.config/lazygit/config.yml" \
          "$HOME/.config/betterlockscreen/betterlockscreenrc" \
          "$HOME/.config/rofi/catppuccin-mocha.rasi" \
          "$HOME/.config/rofi/config.rasi"
        do
          if [ -L "$link_path" ]; then
            target=$(readlink "$link_path")
            success_links+=("$link_path")
            echo "  ✓ $link_path"
            echo "    → $target"
          else
            failed_links+=("$link_path")
            echo "  ✗ FAILED: $link_path"
            if [ -e "$link_path" ]; then
              echo "    (File exists but is not a symlink)"
            else
              echo "    (Symlink was not created)"
            fi
          fi
        done
        
        echo ""
        success_count=${#success_links[@]}
        failed_count=${#failed_links[@]}
        total=$((success_count + failed_count))
        
        echo "Result: $success_count/$total symlinks created successfully"
        
        if [ $failed_count -gt 0 ]; then
          echo ""
          echo "Failed symlinks (needs manual intervention):"
          for link in "${failed_links[@]}"; do
            echo "  - $link"
          done
          echo ""
          echo "Try running dotbot with verbose output:"
          echo "  python3 dotbot/bin/dotbot -c install.conf.yaml -vv"
          exit 1
        fi
        
        # Show backup files if any
        echo ""
        backup_files=$(find "$HOME" -maxdepth 2 -name "*.backup.*" 2>/dev/null | wc -l)
        if [ $backup_files -gt 0 ]; then
          echo "Backup files created: $backup_files"
          find "$HOME" -maxdepth 2 -name "*.backup.*" 2>/dev/null | head -5
        fi
        
        echo ""
        echo "✓ Dotfiles successfully installed!"
        
      description: Verify all symlinks created successfully
      stderr: true
